
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff0f5">

    <title>For Sundapii ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="birthday-page">

    <!-- Floating decorative hearts -->
    <div class="floating-hearts" aria-hidden="true">
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
    </div>

    <!-- Main birthday card -->
    <section class="welcome-card">

        <p class="top-label">A LITTLE SURPRISE FOR YOU</p>

        <div class="envelope" aria-hidden="true">
            <div class="envelope-back"></div>
            <div class="letter">
                <span>For you</span>
                <span class="letter-heart">♥</span>
            </div>
            <div class="envelope-front"></div>
            <div class="envelope-flap"></div>
            <div class="envelope-seal">♡</div>
        </div>

        <p class="little-text">Someone made something special...</p>

        <h1>Happy Birthday,<br>
            <span class="name">Sundapii!</span>
        </h1>

        <p class="description">
            A little world filled with memories, smiles,
            and words meant just for you. ♡
        </p>

        <button
                class="surprise-button"
                id="openSurprise"
                type="button"
        >
            Open Your Surprise
            <span aria-hidden="true">♡</span>
        </button>

        <p class="bottom-note">
            Made with love, just for you ✿
        </p>

    </section>

    <p class="footer-text">A tiny birthday universe ♡</p>

</main>

<script src="script.js"></script>

</body>
</html>
